# path to a directory with all packages
storage: /verdaccio/storage/data
# path to a directory with plugins to include
plugins: /verdaccio/plugins

# This sample is wired up to work as-is against the Keycloak devcontainer in
# docker-compose.yml (keycloak/realm-export.json + bootstrap-test-user.sh),
# for local manual testing: `docker compose up`, then
# `./keycloak/bootstrap-test-user.sh`, then log in as alice/alicepw.
auth:
  '@fortmesa/verdaccio-generic-oidc':
    # Verdaccio public URL. If served on a subpath, make sure to include a
    # trailing slash.
    publicUrl: http://localhost:4873

    # Exactly one of redis / filesystem / dynamo is required, for session and
    # token storage (see docs/configuration.md, "Storage backends").

    # Redis: works across multiple Verdaccio replicas. `keyPrefix` namespaces
    # every key, for sharing one Redis instance legibly with other consumers
    # -- optional, defaults to no prefix. Connection retry/backoff is fixed,
    # not configurable.
    redis:
      url: redis
      #keyPrefix: verdaccio-oidc-

    # Filesystem: zero extra dependencies, but doesn't work across multiple
    # replicas (each has its own disk). Used if `redis`/`dynamo` aren't set.
    #filesystem:
    #  sessionPath: /tmp
    #  tokenPath: /tmp

    # DynamoDB: works across multiple replicas. `tableName` is required;
    # the rest are optional. `sortKeyValue` is only needed when reusing a
    # table whose key schema already declares a sort key (`pk` + `sk`).
    #dynamo:
    #  tableName: my-table
    #  region: us-east-1
    #  keyPrefix: verdaccio-oidc-
    #  sortKeyValue: OIDC
    #  ttlAttribute: expireTime

    session:
      # How long (seconds) a session lookup is trusted from an in-memory
      # cache before re-checking the storage backend above --
      # authenticate() runs on every authenticated request, not just
      # logins, so this matters regardless of which backend is selected.
      # Default is 5 minutes (300); set to 0 to disable caching entirely.
      cacheTtl: 300

    # OpenID Connect Issuer URL -- "keycloak" here is the docker-compose
    # service name, reachable from the verdaccio container over the compose
    # network. Matches keycloak/realm-export.json's "verdaccio-test" realm.
    issuer: http://keycloak:8080/realms/verdaccio-test
    # OpenID Connect Client ID.
    # Alternatively can be set via environment variable OIDC_CLIENT_ID
    clientId: oauthClientIdName
    # OpenID Connect Client Secret. Optional -- if omitted, the plugin
    # registers as a public client and uses PKCE (S256) instead of a secret
    # to protect the code exchange. Only works if your provider supports a
    # secret-less public web client (Keycloak does; Google does not).
    # See docs/configuration.md, section "Client authentication".
    # Alternatively can be set via environment variable OIDC_CLIENT_SECRET
    clientSecret: oauthClientIdName-test-secret
    # OpenID Connect Scopes
    scope: 'openid profile email offline_access'
    # Optional id_token claim that will be used for username
    usernameClaim: preferred_username

    roles:
      # Client roles (resource_access.<clientId>.roles) -- the "admin"
      # client role on the "oauthClientIdName" client, per
      # keycloak/realm-export.json. To use the realm role instead
      # (npm-publish), switch to:
      #   claim: realm_access.roles
      claim: resource_access
      # Sub-key holding the role array when claim resolves to a map of
      # name -> object (Keycloak's resource_access.<client> shape below).
      # Only needed if your provider uses a key other than "roles" --
      # already the default, so commented out here since it's redundant
      # with the Keycloak shape actually in use.
      #mapKey: roles
      # See docs/keycloak.md: Keycloak's built-in role mappers default to
      # NOT including roles in the ID token -- realm-export.json
      # pre-enables "Add to ID token" on both, or this claim would
      # silently be empty.
      allowList:
        oauthClientIdName: [admin]

    # Set true to disable the interactive `/-/v1/login` (npm/yarn
    # web-login) flow entirely, leaving only the token-exchange endpoint
    # (PUT /-/user/org.couchdb.user::userId) available. Default false.
    #accessTokenAuth: false

web:
  title: Verdaccio

uplinks:
  npmjs:
    url: https://registry.npmjs.org/

## security system settings ( https://verdaccio.org/docs/configuration/#security )
security:
  api:
    legacy: false
    jwt:
      sign:
        # lifetime for [cli-to-verdaccio service] jwt tokens that link to oidc server tokens (using sid claim).
        # oidc server tokens lifetime (set by oidc server) check as usual after check [cli-to-verdaccio service] jwt token sign and expiration.
        # if oidc server returns refresh_token, oidc access_token will refresh when expired.
        expiresIn: 30d
  web:
    sign:
      expiresIn: 7d

packages:
  '@*/*':
    # scoped packages
    access: $authenticated
    publish: $authenticated
  '**':
    access: $authenticated
    publish: $authenticated

middlewares:
  audit:
    enabled: true
logs:
  - {type: stdout, format: pretty, level: info}
